<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">Google Pay (UPI) Database - Entity-Relationship Diagram</text>
  <text x="800" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">PostgreSQL 15+ Production Relational Model (3NF / BCNF Compliant)</text>

  <!-- Relationships Lines -->
  <!-- cities -> users -->
  <path d="M 260 210 L 330 210" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="295" y="200" fill="#38bdf8" font-size="11" text-anchor="middle">1 : N</text>

  <!-- cities -> merchants -->
  <path d="M 170 330 L 170 420" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="190" y="375" fill="#38bdf8" font-size="11">1 : N</text>

  <!-- users -> bank_accounts -->
  <path d="M 550 200 L 640 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="595" y="190" fill="#38bdf8" font-size="11" text-anchor="middle">1 : N</text>

  <!-- users -> vpas -->
  <path d="M 550 280 L 600 280 L 600 370 L 640 370" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="595" y="340" fill="#38bdf8" font-size="11" text-anchor="middle">1 : N</text>

  <!-- bank_accounts -> vpas -->
  <path d="M 740 310 L 740 350" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="760" y="335" fill="#10b981" font-size="11">1 : 1</text>

  <!-- vpas -> transactions (payer) -->
  <path d="M 860 410 L 960 410" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="910" y="400" fill="#f59e0b" font-size="11" text-anchor="middle">1 : N (payer)</text>

  <!-- merchants -> transactions -->
  <path d="M 260 520 L 960 520" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="600" y="510" fill="#f59e0b" font-size="11" text-anchor="middle">1 : N (P2M merchant)</text>

  <!-- users -> bill_payments -->
  <path d="M 440 380 L 440 700" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="460" y="650" fill="#38bdf8" font-size="11">1 : N</text>

  <!-- transactions -> rewards -->
  <path d="M 1190 390 L 1300 390" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="1245" y="380" fill="#a855f7" font-size="11" text-anchor="middle">1 : 0..1</text>

  <!-- users -> rewards -->
  <path d="M 480 380 L 480 470 L 1260 470 L 1260 300 L 1300 300" fill="none" stroke="#64748b" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1100" y="460" fill="#64748b" font-size="10">redundant (1:N)</text>

  <!-- transactions -> disputes -->
  <path d="M 1075 620 L 1075 750" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="1095" y="690" fill="#ef4444" font-size="11">1 : 0..1</text>

  <!-- users -> disputes -->
  <path d="M 410 380 L 410 850 L 960 850" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-active)"/>
  <text x="680" y="840" fill="#38bdf8" font-size="11">1 : N (raised_by)</text>

  <!-- ================= ENTITY BOXES ================= -->

  <!-- CITIES -->
  <g transform="translate(50, 140)" filter="url(#dropShadow)">
    <rect width="210" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="210" height="35" rx="8" fill="#334155"/>
    <text x="105" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">cities</text>
    <text x="15" y="60" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>city_id: INT</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12">city_name: VARCHAR(100)</text>
    <text x="15" y="110" fill="#cbd5e1" font-size="12">state: VARCHAR(100)</text>
  </g>

  <!-- USERS -->
  <g transform="translate(330, 130)" filter="url(#dropShadow)">
    <rect width="220" height="250" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="220" height="35" rx="8" fill="#334155"/>
    <text x="110" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">users</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>user_id: INT</text>
    <text x="15" y="80" fill="#cbd5e1" font-size="12">full_name: VARCHAR(150)</text>
    <text x="15" y="102" fill="#f8fafc" font-size="12"><tspan fill="#10b981" font-weight="bold">UQ </tspan>phone: VARCHAR(15)</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12"><tspan fill="#10b981" font-weight="bold">UQ </tspan>email: VARCHAR(255)</text>
    <text x="15" y="146" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>city_id: INT</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">kyc_status: VARCHAR(20)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">is_blocked: BOOLEAN</text>
    <text x="15" y="212" fill="#cbd5e1" font-size="12">created_at: TIMESTAMPTZ</text>
  </g>

  <!-- BANK_ACCOUNTS -->
  <g transform="translate(640, 120)" filter="url(#dropShadow)">
    <rect width="220" height="240" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="220" height="35" rx="8" fill="#334155"/>
    <text x="110" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">bank_accounts</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>account_id: INT</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>user_id: INT</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="12">bank_name: VARCHAR(100)</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12">ifsc: VARCHAR(11)</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">account_last4: VARCHAR(4)</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">account_type: VARCHAR(20)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">is_primary: BOOLEAN</text>
    <text x="15" y="212" fill="#cbd5e1" font-size="12">linked_at: TIMESTAMPTZ</text>
  </g>

  <!-- VPAS -->
  <g transform="translate(640, 360)" filter="url(#dropShadow)">
    <rect width="220" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="220" height="35" rx="8" fill="#334155"/>
    <text x="110" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">vpas</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>vpa: VARCHAR(100)</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>user_id: INT</text>
    <text x="15" y="102" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK,UQ </tspan>account_id: INT</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12">is_active: BOOLEAN</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">created_at: TIMESTAMPTZ</text>
  </g>

  <!-- MERCHANTS -->
  <g transform="translate(50, 420)" filter="url(#dropShadow)">
    <rect width="210" height="220" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="210" height="35" rx="8" fill="#334155"/>
    <text x="105" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">merchants</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>merchant_id: INT</text>
    <text x="15" y="80" fill="#cbd5e1" font-size="12">merchant_name: VARCHAR</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="12">mcc: VARCHAR(4)</text>
    <text x="15" y="124" fill="#f8fafc" font-size="12"><tspan fill="#10b981" font-weight="bold">UQ </tspan>merchant_vpa: VARCHAR</text>
    <text x="15" y="146" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>city_id: INT</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">is_verified: BOOLEAN</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">onboarded_on: DATE</text>
  </g>

  <!-- TRANSACTIONS -->
  <g transform="translate(960, 240)" filter="url(#dropShadow)">
    <rect width="230" height="330" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="35" rx="8" fill="#334155"/>
    <text x="115" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">transactions</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>txn_id: BIGINT</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#10b981" font-weight="bold">UQ </tspan>upi_ref: VARCHAR(12)</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="12">txn_type: VARCHAR(10)</text>
    <text x="15" y="124" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>payer_vpa: VARCHAR</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">payee_vpa: VARCHAR(100)</text>
    <text x="15" y="168" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>merchant_id: INT (opt)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">amount: NUMERIC(12, 2)</text>
    <text x="15" y="212" fill="#cbd5e1" font-size="12">note: VARCHAR(255)</text>
    <text x="15" y="234" fill="#cbd5e1" font-size="12">initiated_at: TIMESTAMPTZ</text>
    <text x="15" y="256" fill="#cbd5e1" font-size="12">completed_at: TIMESTAMPTZ</text>
    <text x="15" y="278" fill="#cbd5e1" font-size="12">status: VARCHAR(20)</text>
    <text x="15" y="300" fill="#cbd5e1" font-size="12">failure_code: VARCHAR(10)</text>
  </g>

  <!-- REWARDS -->
  <g transform="translate(1300, 230)" filter="url(#dropShadow)">
    <rect width="230" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="35" rx="8" fill="#334155"/>
    <text x="115" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">rewards</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>reward_id: INT</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>user_id: INT</text>
    <text x="15" y="102" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK,UQ </tspan>txn_id: BIGINT</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12">reward_type: VARCHAR(20)</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">amount: NUMERIC(10, 2)</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">status: VARCHAR(20)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">issued_at: TIMESTAMPTZ</text>
    <text x="15" y="212" fill="#cbd5e1" font-size="12">expires_at: TIMESTAMPTZ</text>
    <text x="15" y="234" fill="#cbd5e1" font-size="12">credited_at: TIMESTAMPTZ</text>
  </g>

  <!-- BILL_PAYMENTS -->
  <g transform="translate(330, 700)" filter="url(#dropShadow)">
    <rect width="230" height="260" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="35" rx="8" fill="#334155"/>
    <text x="115" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">bill_payments</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>bill_id: INT</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>user_id: INT</text>
    <text x="15" y="102" fill="#cbd5e1" font-size="12">biller_category: VARCHAR</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12">biller_name: VARCHAR(100)</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">consumer_number: VARCHAR</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">amount: NUMERIC(12, 2)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">due_date: DATE</text>
    <text x="15" y="212" fill="#cbd5e1" font-size="12">status: VARCHAR(20)</text>
    <text x="15" y="234" fill="#cbd5e1" font-size="12">paid_at: TIMESTAMPTZ</text>
  </g>

  <!-- DISPUTES -->
  <g transform="translate(960, 750)" filter="url(#dropShadow)">
    <rect width="230" height="220" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <rect width="230" height="35" rx="8" fill="#334155"/>
    <text x="115" y="24" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">disputes</text>
    <text x="15" y="58" fill="#f8fafc" font-size="12"><tspan fill="#f59e0b" font-weight="bold">PK </tspan>dispute_id: INT</text>
    <text x="15" y="80" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK,UQ </tspan>txn_id: BIGINT</text>
    <text x="15" y="102" fill="#f8fafc" font-size="12"><tspan fill="#38bdf8" font-weight="bold">FK </tspan>raised_by: INT</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="12">reason: VARCHAR(50)</text>
    <text x="15" y="146" fill="#cbd5e1" font-size="12">raised_at: TIMESTAMPTZ</text>
    <text x="15" y="168" fill="#cbd5e1" font-size="12">status: VARCHAR(20)</text>
    <text x="15" y="190" fill="#cbd5e1" font-size="12">resolved_at: TIMESTAMPTZ</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 920)">
    <rect width="250" height="120" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="25" fill="#94a3b8" font-size="12" font-weight="bold">KEY CONVENTIONS</text>
    <text x="20" y="48" fill="#f59e0b" font-size="12" font-weight="bold">PK <tspan fill="#cbd5e1" font-weight="normal">Primary Key</tspan></text>
    <text x="20" y="70" fill="#38bdf8" font-size="12" font-weight="bold">FK <tspan fill="#cbd5e1" font-weight="normal">Foreign Key Constraint</tspan></text>
    <text x="20" y="92" fill="#10b981" font-size="12" font-weight="bold">UQ <tspan fill="#cbd5e1" font-weight="normal">Unique Natural Key</tspan></text>
  </g>
</svg>